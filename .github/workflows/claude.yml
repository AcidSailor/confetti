name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push branch changes.
      pull-requests: write # Open pull requests.
      issues: write
      id-token: write
      actions: read # Read CI results.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history lets reviews compare the branch with its base.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enable '@claude /pr-review-toolkit:review-pr'.
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "pr-review-toolkit@claude-plugins-official"

          # Lint runs in ci.yml; this job has no golangci-lint installation.
          claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr create:*),Bash(gh run view:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(go test:*),Bash(go vet:*),Bash(go build:*),Bash(gofmt:*)"'

          # Allow Claude to read CI results.
          additional_permissions: |
            actions: read
