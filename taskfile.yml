version: "3"

tasks:
  lint:
    desc: Format and lint with automatic fixes
    cmds:
      - golangci-lint fmt
      - golangci-lint run --fix

  ci:
    desc: Check formatting and lint without changing files
    cmds:
      - golangci-lint fmt --diff
      - golangci-lint run

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  check:
    desc: Apply lint fixes, then run tests
    cmds:
      - task: lint
      - task: test

  build:
    desc: Compile all packages
    cmds:
      - go build ./...

  release:
    desc: Publish a tagged GitHub release and changelog with GoReleaser
    cmds:
      - goreleaser release --clean

  release-plan:
    desc: Preview the next version from conventional commits
    silent: true
    cmds:
      - svu next --v0

  release-tag:
    desc: Create and push the next version tag to trigger the release workflow
    cmds:
      - |
        set -euo pipefail
        next=$(svu next --v0)
        if [ -z "$next" ]; then echo "svu returned no version — is svu installed?" >&2; exit 1; fi
        if [ "$next" = "$(svu current)" ]; then echo "nothing to release (at $next)"; exit 0; fi
        git tag -a "$next" -m "release $next"
        git push origin "$next"
        echo "pushed $next → CI will build the release"

  update:
    desc: Update from the go-scaffolds v1 template with default answers
    cmds:
      - uvx copier update --defaults --vcs-ref v1
